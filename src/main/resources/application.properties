# ===============================================================
# SERVER CONFIGURATION
# ===============================================================
# Порт, на котором будет запущено приложение. 8080 - стандартный.
server.port=8080


# ===============================================================
# DATABASE CONFIGURATION (PostgreSQL)
# ===============================================================
# Полный URL для подключения к вашей базе данных.
# Рекомендуется хранить этот URL в переменной окружения (например, DATABASE_URL).
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://dpg-d3na3p9r0fns73fevm9g-a/lab2lol}

# Имя пользователя и пароль. Spring Boot может извлечь их из URL выше,
# но явное указание через переменные окружения является более надежным подходом.
spring.datasource.username=${DATABASE_USER:user}
spring.datasource.password=${DATABASE_PASSWORD:qtIkrCUVuURsivpoYGU3ZDIX8Q8PMgzp}


# ===============================================================
# JPA & HIBERNATE CONFIGURATION
# ===============================================================
# Позволяет Hibernate автоматически обновлять схему базы данных при запуске.
# ВНИМАНИЕ: Используйте 'update' только для разработки!
# Для продакшена выберите 'validate' или 'none' и используйте миграции (Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=update

# Включает отображение SQL-запросов в консоли. Полезно для отладки.
spring.jpa.show-sql=true

# Hibernate автоматически определит диалект для PostgreSQL, но его можно указать явно.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Дополнительные свойства для красивого форматирования SQL в логах.
spring.jpa.properties.hibernate.format_sql=true


# ===============================================================
# JWT (JSON Web Token) CONFIGURATION
# ===============================================================
# Секретный ключ для подписи JWT. ДОЛЖЕН быть сложным и храниться в секрете.
# Используйте переменную окружения (например, JWT_SECRET).
jwt.secret=${JWT_SECRET:eyJzZWNyZXRfa2V5X3dpdGhfMzJfY2hhcnN9dsu7fHSF7sachSFbjkANCedsjfvbs9734hf73nf37asjdc6sefhv634}

# Время жизни токена в миллисекундах (86400000 мс = 24 часа).
jwt.expiration=${JWT_EXPIRATION:86400000}
